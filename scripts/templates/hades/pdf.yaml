# Opciones de pandoc para exportar a PDF (md_to_pdf.py -t pdf).
# ${.} es la carpeta de este fichero. El diseño está en template.tex;
# desde el YAML del documento se pueden usar toc, bibliography, csl,
# unidad-numero, asignatura... (ver README.md).

to: latex
standalone: true
template: ${.}/template.tex

highlight-style: ${.}/hades.theme

citeproc: true

filters:
  - ${.}/cajas.lua
  - ${.}/callouts.lua
  - ${.}/tablas.lua

metadata:
  # Estilo de citas por defecto (el documento puede indicar otro)
  # (se busca también en esta carpeta: md_to_pdf.py la añade al resource-path)
  csl: apa.csl
  link-citations: true
