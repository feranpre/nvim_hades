# Opciones que md_to_pdf.py pasa a `quarto render` (--metadata-file) al
# exportar .qmd / .Rmd. ${.} se sustituye por la carpeta de este fichero y
# ${rel} por esa misma carpeta relativa al documento (quarto solo encuentra
# los .theme de highlight-style con una ruta relativa al documento).
# Lo que pongas en el YAML del propio documento tiene prioridad.

format:
  pdf:
    # Mismo diseño que los .md (template.tex)
    template: ${.}/template.tex
    pdf-engine: xelatex
    highlight-style: ${rel}/hades.theme
    filters:
      - ${.}/cajas.lua
    csl: ${.}/apa.csl
    link-citations: true

  html:
    theme:
      - cosmo
      - ${.}/hades.scss
    embed-resources: true
    html-math-method: mathml
    highlight-style: ${rel}/hades.theme
    csl: ${.}/apa.csl
    link-citations: true

# Textos en castellano sin depender de babel
language:
  toc-title-document: Índice
  crossref-fig-title: Figura
  crossref-tbl-title: Tabla
  crossref-lst-title: Listado
  crossref-eq-prefix: Ecuación
  crossref-fig-prefix: Figura
  crossref-tbl-prefix: Tabla
  title-block-author-single: Autor
  title-block-author-plural: Autores
  title-block-published: Fecha
  callout-note-title: Nota
  callout-tip-title: Consejo
  callout-important-title: Importante
  callout-warning-title: Atención
  callout-caution-title: Precaución
  code-summary: Código
